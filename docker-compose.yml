services:
  focus-app:
    build:
      context: .
      network: host
      dockerfile_inline: |
        FROM node:24-alpine

        WORKDIR /app

        COPY package.json ./
        RUN npm install --production

        COPY . .

        EXPOSE 3000

        CMD ["node", "server.js"]
    networks:
      - apache_letsencrypt
    volumes:
      - ./notes.md:/app/notes.md
      - ./config.json:/app/config.json
    restart: unless-stopped

networks:
  apache_letsencrypt:
    external: true
