<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a4e69">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Focus</title>
  <script>
    // Set base href dynamically based on current path
    (function() {
      const path = window.location.pathname;
      const base = document.createElement('base');
      // If path ends with index.html or /, use the directory as base
      // Otherwise assume we're at /something and use that as base
      if (path.endsWith('/') || path.endsWith('/index.html')) {
        base.href = path.replace(/index\.html$/, '');
      } else {
        base.href = path + '/';
      }
      document.head.appendChild(base);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {};
  </script>
  <style>
    /* Custom scrollbar for time picker columns */
    .time-picker-column::-webkit-scrollbar { width: 6px; }
    .time-picker-column::-webkit-scrollbar-thumb { background: #4a4e69; border-radius: 3px; }
  </style>
</head>

<body class="bg-[#1a1a2e] text-[#eee] min-h-screen overflow-x-hidden font-sans">
  <div id="root"></div>

  <script>
    // Initialize Web Workers for accurate background timing
    // These workers are not affected by browser throttling when tab is in background
    try {
      window.timerWorker = new Worker('js/timeWorker.js');
      window.stopwatchWorker = new Worker('js/stopwatchWorker.js');
      window.alarmWorker = new Worker('js/alarmWorker.js');
    } catch (error) {
      console.error('Worker creation failed:', error);
      window.timerWorker = null;
      window.stopwatchWorker = null;
      window.alarmWorker = null;
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ============ AUDIO UTILITY ============
    let alarmAudioInterval = null;

    const playAlarmSound = () => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const playBeep = (freq, startTime, duration) => {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = freq;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, startTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
      };

      // Play a sequence of beeps
      const now = audioCtx.currentTime;
      for (let i = 0; i < 5; i++) {
        playBeep(800, now + i * 0.3, 0.2);
      }
    };

    const startContinuousAlarm = () => {
      if (alarmAudioInterval) return; // Already playing
      playAlarmSound();
      alarmAudioInterval = setInterval(() => {
        playAlarmSound();
      }, 2000); // Repeat every 2 seconds
    };

    const stopContinuousAlarm = () => {
      if (alarmAudioInterval) {
        clearInterval(alarmAudioInterval);
        alarmAudioInterval = null;
      }
    };

    // ============ CUSTOM TIME PICKER COMPONENT ============
    const CustomTimePicker = ({ value, onChange, onClose }) => {
      const hours = Array.from({ length: 24 }, (_, i) => i.toString().padStart(2, '0'));
      const minutes = Array.from({ length: 60 }, (_, i) => i.toString().padStart(2, '0'));

      const [selectedHour, selectedMinute] = (value || '00:00').split(':');

      const hourRef = useRef(null);
      const minuteRef = useRef(null);

      useEffect(() => {
        // Scroll to selected values on mount
        if (hourRef.current) {
          const activeEl = hourRef.current.querySelector('.picker-active');
          if (activeEl) activeEl.scrollIntoView({ block: 'center' });
        }
        if (minuteRef.current) {
          const activeEl = minuteRef.current.querySelector('.picker-active');
          if (activeEl) activeEl.scrollIntoView({ block: 'center' });
        }
      }, []);

      const handleHourClick = (h) => {
        onChange(`${h}:${selectedMinute}`);
      };

      const handleMinuteClick = (m) => {
        onChange(`${selectedHour}:${m}`);
      };

      return (
        <>
          <div className="fixed inset-0 z-[999]" onClick={onClose}></div>
          <div
            className="absolute top-full left-1/2 -translate-x-1/2 mt-2 bg-[#16213e] border border-[#4a4e69] rounded-lg shadow-[0_4px_20px_rgba(0,0,0,0.5)] z-[1000] flex overflow-hidden w-[200px] h-[250px]"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="time-picker-column flex-1 overflow-y-auto scroll-smooth" ref={hourRef}>
              <div className="text-center py-1 bg-[#16213e] border-b border-[#4a4e69] sticky top-0 text-xs text-[#888] font-mono">HH</div>
              {hours.map(h => (
                <div
                  key={h}
                  className={`picker-active px-2 py-2 text-center cursor-pointer ${h === selectedHour ? 'bg-[#9d4edd] text-white font-bold' : 'text-[#888] hover:bg-[#4a4e69] hover:text-[#eee]'}`}
                  onClick={() => handleHourClick(h)}
                >
                  {h}
                </div>
              ))}
              <div style={{ height: 125 }}></div>
            </div>
            <div className="time-picker-column flex-1 overflow-y-auto scroll-smooth border-l border-[#4a4e69]" ref={minuteRef}>
              <div className="text-center py-1 bg-[#16213e] border-b border-[#4a4e69] sticky top-0 text-xs text-[#888] font-mono">MM</div>
              {minutes.map(m => (
                <div
                  key={m}
                  className={`picker-active px-2 py-2 text-center cursor-pointer ${m === selectedMinute ? 'bg-[#9d4edd] text-white font-bold' : 'text-[#888] hover:bg-[#4a4e69] hover:text-[#eee]'}`}
                  onClick={() => handleMinuteClick(m)}
                >
                  {m}
                </div>
              ))}
              <div style={{ height: 125 }}></div>
            </div>
          </div>
        </>
      );
    };

    // ============ LOGIN COMPONENT ============
    const Login = ({ onLogin }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        setError('');
        
        try {
          const res = await fetch('api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          
          if (res.ok) {
            onLogin();
          } else {
            setError('Incorrect password');
          }
        } catch (err) {
          setError('Connection error');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen p-5">
          <h1 className="mb-5 text-[#9d4edd] text-2xl font-bold">🧠 Focus</h1>
          <form className="flex flex-col items-center" onSubmit={handleSubmit}>
            <input
              type="password"
              placeholder="Enter password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              autoFocus
              disabled={isLoading}
              className="px-5 py-3 text-base border-2 border-[#4a4e69] rounded-lg bg-[#16213e] text-[#eee] mb-4 w-[250px] outline-none"
            />
            <button
              type="submit"
              disabled={isLoading}
              className="px-10 py-3 text-base bg-[#9d4edd] text-white border-none rounded-lg cursor-pointer hover:bg-[#7b2cbf] disabled:opacity-60"
            >
              {isLoading ? 'Loading...' : 'Enter'}
            </button>
          </form>
          {error && <p className="text-[#ef4444] mt-2.5">{error}</p>}
        </div>
      );
    };

    // ============ ALARM COMPONENT ============
    const Alarm = ({ isActive, onActiveChange, onAlarmTimeChange }) => {
      const [alarmTime, setAlarmTime] = useState(() => {
        const now = new Date();
        return now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      });
      const [isMobile, setIsMobile] = useState(false);
      const [isPickerOpen, setIsPickerOpen] = useState(false);
      const [isSet, setIsSet] = useState(false);

      useEffect(() => {
        const checkMobile = () => {
          const ua = navigator.userAgent.toLowerCase();
          return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
        };
        setIsMobile(checkMobile());
      }, []);
      const [isRinging, setIsRinging] = useState(false);
      const workerRef = useRef(window.alarmWorker);

      // Format time in 24-hour format
      const formatTime24h = (timeStr) => {
        if (!timeStr) return '';
        return timeStr;
      };

      useEffect(() => {
        onAlarmTimeChange(isSet ? formatTime24h(alarmTime) : '');
      }, [isSet, alarmTime, onAlarmTimeChange]);

      // Setup worker message handler
      useEffect(() => {
        const worker = workerRef.current;
        if (!worker) return;

        const handleMessage = (e) => {
          const { type } = e.data;
          switch (type) {
            case 'alarm':
              if (!isRinging) {
                setIsRinging(true);
                onActiveChange(true);
                startContinuousAlarm();
                try {
                  if (Notification.permission === 'granted') {
                    new Notification('⏰ Alarm!', { body: `It's ${alarmTime}` });
                  }
                } catch (e) {
                  console.log('Notification error:', e);
                }
              }
              break;
          }
        };

        worker.addEventListener('message', handleMessage);
        return () => worker.removeEventListener('message', handleMessage);
      }, [alarmTime, isRinging, onActiveChange]);

      const handleSet = () => {
        if (alarmTime) {
          setIsSet(true);
          onActiveChange(true);
          Notification.requestPermission();
          if (workerRef.current) {
            workerRef.current.postMessage({ command: 'set', time: alarmTime });
          }
        }
      };

      const handleClear = () => {
        setIsSet(false);
        setIsRinging(false);
        onActiveChange(false);
        stopContinuousAlarm();
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'clear' });
        }
      };

      const handleDismiss = () => {
        setIsRinging(false);
        setIsSet(false);
        onActiveChange(false);
        stopContinuousAlarm();
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'clear' });
        }
      };

      return (
        <div>
          {isRinging && (
            <div className="fixed top-0 left-0 right-0 bg-[#ef4444] text-white py-4 text-center font-bold z-[1000]">
              ⏰ ALARM! It's {formatTime24h(alarmTime)}
              <button
                onClick={handleDismiss}
                className="ml-4 px-5 py-2 bg-white text-[#ef4444] border-none rounded cursor-pointer font-bold"
              >Dismiss</button>
            </div>
          )}
          <div className="flex justify-center my-2.5 relative" style={{ width: 'fit-content', margin: '10px auto' }}>
            <div
              onClick={() => !isSet && !isMobile && setIsPickerOpen(!isPickerOpen)}
              style={{
                padding: '8px',
                fontSize: '18px',
                textAlign: 'center',
                background: '#16213e',
                border: '1px solid #4a4e69',
                borderRadius: '4px',
                color: isSet ? '#888' : '#eee',
                width: '140px',
                cursor: isSet ? 'not-allowed' : (isMobile ? 'default' : 'pointer'),
                userSelect: 'none'
              }}
            >
              {alarmTime}
            </div>

            {/* Desktop: Custom Picker */}
            {!isMobile && isPickerOpen && !isSet && (
              <CustomTimePicker
                value={alarmTime}
                onChange={setAlarmTime}
                onClose={() => setIsPickerOpen(false)}
              />
            )}

            {/* Mobile: Native Overlay Input */}
            {isMobile && (
              <input
                type="time"
                value={alarmTime}
                onChange={(e) => setAlarmTime(e.target.value)}
                disabled={isSet}
                className="absolute inset-0 opacity-0"
                style={{ cursor: isSet ? 'default' : 'pointer' }}
              />
            )}
          </div>
          {isSet && (
            <div className="text-4xl font-mono text-center my-2.5 text-[#9d4edd]">
              Set for {formatTime24h(alarmTime)}
            </div>
          )}
          <div className="flex justify-center gap-2.5 flex-wrap">
            {!isSet ? (
              <button
                className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#9d4edd] text-white"
                onClick={handleSet}
              >Set Alarm</button>
            ) : (
              <button
                className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#ef4444] text-white"
                onClick={handleClear}
              >Clear</button>
            )}
          </div>
        </div>
      );
    };

    // ============ TIMER COMPONENT ============
    const Timer = ({ isActive, onActiveChange, onTimeLeftChange }) => {
      const [minutes, setMinutes] = useState(30);
      const [seconds, setSeconds] = useState(0);
      const [timeLeft, setTimeLeft] = useState(null);
      const [isRunning, setIsRunning] = useState(false);
      const [isFinished, setIsFinished] = useState(false);
      const workerRef = useRef(window.timerWorker);

      useEffect(() => {
        onTimeLeftChange(timeLeft !== null ? timeLeft : (minutes * 60 + seconds));
      }, [timeLeft, minutes, seconds, onTimeLeftChange]);

      // Setup worker message handler
      useEffect(() => {
        const worker = workerRef.current;
        if (!worker) return;

        const handleMessage = (e) => {
          const { type, remaining } = e.data;
          switch (type) {
            case 'tick':
              setTimeLeft(remaining);
              break;
            case 'finished':
              setTimeLeft(0);
              setIsRunning(false);
              setIsFinished(true);
              onActiveChange(false);
              startContinuousAlarm();
              try {
                if (Notification.permission === 'granted') {
                  new Notification('⏱️ Timer Done!', { body: 'Time is up!' });
                }
              } catch (e) {
                // Notification API may not work on some mobile browsers
              }
              break;
            case 'paused':
              setTimeLeft(remaining);
              break;
          }
        };

        worker.addEventListener('message', handleMessage);
        return () => worker.removeEventListener('message', handleMessage);
      }, [onActiveChange]);

      const handleStart = () => {
        const duration = timeLeft !== null ? timeLeft : (minutes * 60 + seconds);
        if (duration <= 0) return;
        
        if (timeLeft === null) {
          setTimeLeft(duration);
        }
        setIsRunning(true);
        setIsFinished(false);
        onActiveChange(true);
        Notification.requestPermission();

        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'start', duration });
        }
      };

      const handlePause = () => {
        setIsRunning(false);
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'pause' });
        }
      };

      const handleReset = () => {
        setIsRunning(false);
        setTimeLeft(null);
        setIsFinished(false);
        onActiveChange(false);
        stopContinuousAlarm();
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'stop' });
        }
      };

      const formatTime = (secs) => {
        if (secs === null) secs = minutes * 60 + seconds;
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div>
          {isFinished && (
            <div className="fixed top-0 left-0 right-0 bg-[#ef4444] text-white py-4 text-center font-bold z-[1000]">
              ⏱️ TIMER DONE!
              <button
                onClick={() => { handleReset(); stopContinuousAlarm(); }}
                className="ml-4 px-5 py-2 bg-white text-[#ef4444] border-none rounded cursor-pointer font-bold"
              >Dismiss</button>
            </div>
          )}
          {timeLeft === null ? (
            <div className="flex justify-center gap-1.5 my-2.5">
              <input
                type="number"
                min="0"
                max="99"
                value={minutes}
                onChange={(e) => setMinutes(Math.max(0, parseInt(e.target.value) || 0))}
                className="w-[60px] p-2 text-lg text-center bg-[#16213e] border border-[#4a4e69] rounded text-[#eee] outline-none"
              />
              <span className="leading-[40px] text-[#888]">:</span>
              <input
                type="number"
                min="0"
                max="59"
                value={seconds}
                onChange={(e) => setSeconds(Math.max(0, Math.min(59, parseInt(e.target.value) || 0)))}
                className="w-[60px] p-2 text-lg text-center bg-[#16213e] border border-[#4a4e69] rounded text-[#eee] outline-none"
              />
            </div>
          ) : null}
          <div className="text-5xl font-mono text-center my-2.5 text-white">{formatTime(timeLeft)}</div>
          <div className="flex justify-center gap-2.5 flex-wrap">
            {!isRunning ? (
              <button
                className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#9d4edd] text-white"
                onClick={handleStart}
              >
                {timeLeft === null ? 'Start' : 'Resume'}
              </button>
            ) : (
              <button
                className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#4a4e69] text-white"
                onClick={handlePause}
              >Pause</button>
            )}
            <button
              className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#ef4444] text-white"
              onClick={handleReset}
            >Reset</button>
          </div>
        </div>
      );
    };

    // ============ STOPWATCH COMPONENT ============
    const Stopwatch = ({ isActive, onActiveChange, onElapsedChange }) => {
      const [elapsed, setElapsed] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const [laps, setLaps] = useState([]);
      const workerRef = useRef(window.stopwatchWorker);

      useEffect(() => {
        onElapsedChange(elapsed);
      }, [elapsed, onElapsedChange]);

      // Setup worker message handler
      useEffect(() => {
        const worker = workerRef.current;
        if (!worker) return;

        const handleMessage = (e) => {
          const { type, elapsed: workerElapsed } = e.data;
          switch (type) {
            case 'tick':
              setElapsed(workerElapsed);
              break;
            case 'stopped':
              setElapsed(workerElapsed);
              break;
            case 'reset':
              setElapsed(0);
              break;
          }
        };

        worker.addEventListener('message', handleMessage);
        return () => worker.removeEventListener('message', handleMessage);
      }, []);

      const handleStart = () => {
        setIsRunning(true);
        onActiveChange(true);
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'start', elapsed });
        }
      };

      const handleStop = () => {
        setIsRunning(false);
        onActiveChange(elapsed > 0);
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'stop' });
        }
      };

      const handleReset = () => {
        setIsRunning(false);
        setElapsed(0);
        setLaps([]);
        onActiveChange(false);
        if (workerRef.current) {
          workerRef.current.postMessage({ command: 'reset' });
        }
      };

      const handleLap = () => {
        setLaps([...laps, elapsed]);
      };

      const formatTime = (ms) => {
        const totalSecs = Math.floor(ms / 1000);
        const hours = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        const centis = Math.floor((ms % 1000) / 10);
        if (hours > 0) {
          return `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${centis.toString().padStart(2, '0')}`;
      };

      return (
        <div>
          <div className="text-5xl font-mono text-center my-2.5 text-white">{formatTime(elapsed)}</div>
          <div className="flex justify-center gap-2.5 flex-wrap">
            {!isRunning ? (
              <button
                className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#9d4edd] text-white"
                onClick={handleStart}
              >
                {elapsed === 0 ? 'Start' : 'Resume'}
              </button>
            ) : (
              <>
                <button
                  className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#4a4e69] text-white"
                  onClick={handleStop}
                >Stop</button>
                <button
                  className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#4a4e69] text-white"
                  onClick={handleLap}
                >Lap</button>
              </>
            )}
            {elapsed > 0 && (
              <button
                className="px-5 py-2.5 text-sm border-none rounded-md cursor-pointer bg-[#ef4444] text-white"
                onClick={handleReset}
              >Reset</button>
            )}
          </div>
          {laps.length > 0 && (
            <div className="mt-4 text-sm text-[#888]">
              {laps.map((lap, i) => (
                <div key={i}>Lap {i + 1}: {formatTime(lap)}</div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ============ MARKDOWN VIEWER COMPONENT ============
    const MarkdownViewer = ({ content }) => {
      // Syntax highlight markdown without rendering it
      const highlightMarkdown = (text) => {
        if (!text) return [];
        
        const lines = text.split('\n');
        const result = [];
        let inCodeBlock = false;
        
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          
          // Check for code block delimiters
          if (line.startsWith('```')) {
            inCodeBlock = !inCodeBlock;
            result.push(<span key={i} className="bg-[#16213e] px-1 py-0.5 rounded text-[#7ee787]">{line}</span>);
            if (i < lines.length - 1) result.push('\n');
            continue;
          }
          
          // Inside code block - highlight entire line
          if (inCodeBlock) {
            result.push(<span key={i} className="bg-[#16213e] px-1 py-0.5 rounded text-[#7ee787]">{line}</span>);
            if (i < lines.length - 1) result.push('\n');
            continue;
          }
          
          // Headings
          if (/^#{1,6}\s/.test(line)) {
            result.push(<span key={i} className="text-[#9d4edd] font-bold">{line}</span>);
            if (i < lines.length - 1) result.push('\n');
            continue;
          }
          
          // Horizontal rules
          if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
            result.push(<span key={i} className="text-[#6e7681]">{line}</span>);
            if (i < lines.length - 1) result.push('\n');
            continue;
          }
          
          // Blockquotes
          if (/^>\s*/.test(line)) {
            result.push(<span key={i} className="text-[#8b949e]">{line}</span>);
            if (i < lines.length - 1) result.push('\n');
            continue;
          }
          
          // List items and checkboxes
          if (/^(\s*[-*+]|\s*\d+\.)\s/.test(line)) {
            const match = line.match(/^(\s*[-*+]|\s*\d+\.)\s/);
            const checkbox = line.match(/^(\s*[-*+]|\s*\d+\.)\s+\[([ xX])\]/);
            if (checkbox) {
              result.push(
                <span key={i}>
                  <span className="text-[#f78166]">{match[0]}</span>
                  <span className="text-[#d29922]">[{checkbox[2]}]</span>
                  {highlightInline(line.slice(match[0].length + 3), `${i}-rest`)}
                </span>
              );
            } else {
              result.push(
                <span key={i}>
                  <span className="text-[#f78166]">{match[0]}</span>
                  {highlightInline(line.slice(match[0].length), `${i}-rest`)}
                </span>
              );
            }
            if (i < lines.length - 1) result.push('\n');
            continue;
          }
          
          // Regular line with inline highlighting
          result.push(<span key={i}>{highlightInline(line, i)}</span>);
          if (i < lines.length - 1) result.push('\n');
        }
        
        return result;
      };
      
      // Highlight inline markdown elements
      const highlightInline = (text, keyPrefix) => {
        const parts = [];
        let remaining = text;
        let partIndex = 0;
        
        while (remaining.length > 0) {
          // Inline code
          let match = remaining.match(/^`([^`]+)`/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="bg-[#16213e] px-1 py-px rounded text-[#7ee787]">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // Bold with **
          match = remaining.match(/^\*\*([^*]+)\*\*/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="text-[#f0a500] font-bold">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // Bold with __
          match = remaining.match(/^__([^_]+)__/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="text-[#f0a500] font-bold">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // Italic with *
          match = remaining.match(/^\*([^*]+)\*/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="text-[#00b4d8] italic">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // Italic with _
          match = remaining.match(/^_([^_]+)_/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="text-[#00b4d8] italic">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // Links [text](url)
          match = remaining.match(/^\[([^\]]+)\]\([^)]+\)/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="text-[#58a6ff]">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // Images ![alt](url)
          match = remaining.match(/^!\[([^\]]*)\]\([^)]+\)/);
          if (match) {
            parts.push(<span key={`${keyPrefix}-${partIndex++}`} className="text-[#58a6ff]">{match[0]}</span>);
            remaining = remaining.slice(match[0].length);
            continue;
          }
          
          // No match - accumulate plain text until we hit potential markdown
          let plainEnd = 1;
          while (plainEnd < remaining.length && !/[`*_\[!]/.test(remaining[plainEnd])) {
            plainEnd++;
          }
          parts.push(remaining.slice(0, plainEnd));
          remaining = remaining.slice(plainEnd);
        }
        
        return parts;
      };
      
      return (
        <div className="break-words leading-relaxed whitespace-pre-wrap font-mono text-[0.9em]">
          {highlightMarkdown(content)}
        </div>
      );
    };

    // ============ FAB MENU COMPONENT ============
    const FabMenu = ({ content, grokPromptTemplate }) => {
      const [isOpen, setIsOpen] = useState(false);

      const openGrok = () => {
        // Use template from config, replacing {{CONTENT}} placeholder
        const prompt = grokPromptTemplate.replace('{{CONTENT}}', content);
        const encoded = encodeURIComponent(prompt);
        window.open(`https://grok.com/?q=${encoded}`, '_blank');
        setIsOpen(false);
      };

      return (
        <>
          {isOpen && (
            <div className="fixed bottom-[85px] right-5 bg-[#16213e] rounded-lg shadow-[0_4px_20px_rgba(0,0,0,0.3)] overflow-hidden z-[100]">
              <button
                className="block w-full px-5 py-[15px] bg-transparent border-none text-[#eee] text-left cursor-pointer whitespace-nowrap hover:bg-[#4a4e69]"
                onClick={openGrok}
              >
                🤖 Ask Grok AI for help
              </button>
            </div>
          )}
          <button
            className="fixed bottom-5 right-5 w-14 h-14 rounded-full bg-[#9d4edd] text-white border-none text-2xl cursor-pointer shadow-[0_4px_12px_rgba(157,78,221,0.4)] z-[100] hover:bg-[#7b2cbf]"
            onClick={() => setIsOpen(!isOpen)}
          >
            {isOpen ? '×' : '+'}
          </button>
        </>
      );
    };

    // ============ MAIN APP COMPONENT ============
    const App = () => {
      const [isAuthenticated, setIsAuthenticated] = useState(null);
      const [activeTab, setActiveTab] = useState('alarm');
      const [collapsedTabs, setCollapsedTabs] = useState(new Set());
      const [content, setContent] = useState('');
      const [grokPromptTemplate, setGrokPromptTemplate] = useState('');
      const [alarmActive, setAlarmActive] = useState(false);
      const [timerActive, setTimerActive] = useState(false);
      const [stopwatchActive, setStopwatchActive] = useState(false);
      const [alarmTime, setAlarmTime] = useState('');
      const [timerTimeLeft, setTimerTimeLeft] = useState(0);
      const [stopwatchElapsed, setStopwatchElapsed] = useState(0);
      const wakeLockRef = useRef(null);

      // Screen Wake Lock - keep screen on
      useEffect(() => {
        const requestWakeLock = async () => {
          if ('wakeLock' in navigator) {
            try {
              wakeLockRef.current = await navigator.wakeLock.request('screen');
              console.log('Wake Lock acquired');
              wakeLockRef.current.addEventListener('release', () => {
                console.log('Wake Lock released');
              });
            } catch (err) {
              console.log('Wake Lock error:', err.message);
            }
          }
        };

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            requestWakeLock();
          }
        };

        requestWakeLock();
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLockRef.current) {
            wakeLockRef.current.release();
          }
        };
      }, []);

      // Check authentication on mount
      useEffect(() => {
        fetch('api/check-auth')
          .then(res => {
            setIsAuthenticated(res.ok);
          })
          .catch(() => setIsAuthenticated(false));
      }, []);

      // Setup SSE for content updates
      useEffect(() => {
        if (!isAuthenticated) return;

        // Fetch config (grok prompt template)
        fetch('api/config')
          .then(res => res.json())
          .then(data => {
            if (data.grokPromptTemplate) {
              setGrokPromptTemplate(data.grokPromptTemplate);
            }
          })
          .catch(err => console.error('Failed to fetch config:', err));

        let eventSource = null;
        let reconnectTimeout = null;

        const connectSSE = () => {
          if (eventSource) {
            eventSource.close();
          }

          eventSource = new EventSource('api/content-updates');

          eventSource.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data.content) {
                setContent(data.content);
              }
            } catch (e) {
              console.error('Failed to parse SSE data:', e);
            }
          };

          eventSource.onerror = () => {
            eventSource.close();
            clearTimeout(reconnectTimeout);
            reconnectTimeout = setTimeout(() => {
              console.log('Reconnecting SSE...');
              connectSSE();
            }, 2000);
          };
        };

        connectSSE();

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            console.log('Page visible, reconnecting SSE...');
            clearTimeout(reconnectTimeout);
            connectSSE();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          clearTimeout(reconnectTimeout);
          if (eventSource) {
            eventSource.close();
          }
        };
      }, [isAuthenticated]);

      const formatTabTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const formatStopwatchTime = (ms) => {
        const totalSecs = Math.floor(ms / 1000);
        const hours = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        if (hours > 0) {
          return `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      // Update document title based on active tab
      useEffect(() => {
        let title = 'Focus';
        switch (activeTab) {
          case 'alarm':
            title = alarmTime ? `⏰ ${alarmTime} - Focus` : '⏰ Alarm - Focus';
            break;
          case 'timer':
            title = `⏱️ ${formatTabTime(timerTimeLeft)} - Focus`;
            break;
          case 'stopwatch':
            title = `🏃 ${formatStopwatchTime(stopwatchElapsed)} - Focus`;
            break;
        }
        document.title = title;
      }, [activeTab, alarmTime, timerTimeLeft, stopwatchElapsed]);

      const handleTabClick = (tab) => {
        if (activeTab === tab) {
          setCollapsedTabs(prev => {
            const newSet = new Set(prev);
            if (newSet.has(tab)) {
              newSet.delete(tab);
            } else {
              newSet.add(tab);
            }
            return newSet;
          });
        } else {
          setActiveTab(tab);
          setCollapsedTabs(prev => {
            const newSet = new Set(prev);
            newSet.delete(tab);
            return newSet;
          });
        }
      };

      const handleLogin = () => {
        fetch('api/check-auth')
          .then(res => {
            if (res.ok) {
              setIsAuthenticated(true);
            } else {
              setIsAuthenticated(false);
              alert('Incorrect password');
            }
          });
      };

      if (isAuthenticated === null) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen">
            <h1 className="text-2xl font-bold text-[#9d4edd]">Loading...</h1>
          </div>
        );
      }

      if (!isAuthenticated) {
        return <Login onLogin={handleLogin} />;
      }

      const tabBtnBase = "flex-1 py-3 px-3 bg-transparent border-none text-sm cursor-pointer relative flex flex-col items-center gap-1";

      return (
        <div className="flex flex-col h-screen max-h-screen">
          <div className="bg-[#16213e] border-b border-[#4a4e69]">
            <div className="flex border-b border-[#4a4e69]">
              <button
                data-tab="alarm"
                className={`${tabBtnBase} ${alarmActive ? 'text-[#4ade80]' : (activeTab === 'alarm' ? 'text-[#9d4edd]' : 'text-[#888]')}`}
                onClick={() => handleTabClick('alarm')}
              >
                <span>Alarm</span>
                {alarmTime && (
                  <span className={`text-[28px] font-mono ${activeTab === 'alarm' ? 'text-[#9d4edd]' : 'text-[#666]'}`}>
                    {alarmTime}
                  </span>
                )}
                {activeTab === 'alarm' && <div className="absolute bottom-[-1px] left-0 right-0 h-0.5 bg-[#9d4edd]"></div>}
              </button>
              <button
                data-tab="timer"
                className={`${tabBtnBase} ${timerActive ? 'text-[#4ade80]' : (activeTab === 'timer' ? 'text-[#9d4edd]' : 'text-[#888]')}`}
                onClick={() => handleTabClick('timer')}
              >
                <span>Timer</span>
                <span className={`text-[28px] font-mono ${activeTab === 'timer' ? 'text-[#9d4edd]' : 'text-[#666]'}`}>
                  {formatTabTime(timerTimeLeft)}
                </span>
                {activeTab === 'timer' && <div className="absolute bottom-[-1px] left-0 right-0 h-0.5 bg-[#9d4edd]"></div>}
              </button>
              <button
                data-tab="stopwatch"
                className={`${tabBtnBase} ${stopwatchActive ? 'text-[#4ade80]' : (activeTab === 'stopwatch' ? 'text-[#9d4edd]' : 'text-[#888]')}`}
                onClick={() => handleTabClick('stopwatch')}
              >
                <span>Stopwatch</span>
                <span className={`text-[28px] font-mono ${activeTab === 'stopwatch' ? 'text-[#9d4edd]' : 'text-[#666]'}`}>
                  {formatStopwatchTime(stopwatchElapsed)}
                </span>
                {activeTab === 'stopwatch' && <div className="absolute bottom-[-1px] left-0 right-0 h-0.5 bg-[#9d4edd]"></div>}
              </button>
            </div>
            <div className={`p-4 min-h-[140px] ${activeTab === 'alarm' && !collapsedTabs.has('alarm') ? 'block' : 'hidden'}`}>
              <Alarm isActive={alarmActive} onActiveChange={setAlarmActive} onAlarmTimeChange={setAlarmTime} />
            </div>
            <div className={`p-4 min-h-[140px] ${activeTab === 'timer' && !collapsedTabs.has('timer') ? 'block' : 'hidden'}`}>
              <Timer isActive={timerActive} onActiveChange={setTimerActive} onTimeLeftChange={setTimerTimeLeft} />
            </div>
            <div className={`p-4 min-h-[140px] ${activeTab === 'stopwatch' && !collapsedTabs.has('stopwatch') ? 'block' : 'hidden'}`}>
              <Stopwatch isActive={stopwatchActive} onActiveChange={setStopwatchActive} onElapsedChange={setStopwatchElapsed} />
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 bg-[#1a1a2e]">
            <MarkdownViewer content={content} />
          </div>

          <FabMenu content={content} grokPromptTemplate={grokPromptTemplate} />
        </div>
      );
    };

    // ============ RENDER ============
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed:', err));
    }
  </script>
</body>

</html>
